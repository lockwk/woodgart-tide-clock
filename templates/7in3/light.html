<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800">
<title>Santa Cruz Tide Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  * { cursor: none !important; }

  html, body {
    width: 800px;
    background: #fff;
    color: #000;
    font-family: 'Inter', sans-serif;
  }

  #clock {
    position: relative;
    width: 800px;
    height: 480px;
    background: #fff;
    transition: opacity 0.6s ease;
  }
  #clock.no-data { opacity: 0.2; }

  /* ─── HEADER: left 20, top 16, width 760, height 16 ─── */
  #header {
    position: absolute;
    left: 20px;
    top: 16px;
    width: 760px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  /* Left group: time + date */
  #header-left {
    display: flex;
    align-items: center;
    gap: 24px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 4.8px;
    text-transform: uppercase;
    white-space: nowrap;
    line-height: 1;
  }

  #header-time { color: #000000; }
  #header-date { color: #000; }

  /* Right group: rain + wind + water temp */
  #header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .header-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 4.8px;
    text-transform: uppercase;
    white-space: nowrap;
    line-height: 1;
    color: #000;
  }

  .header-stat img,
  .header-stat svg {
    display: block;
    flex-shrink: 0;
  }

  /* ─── SEPARATOR LINE: full width, below header ─── */
  #header-sep {
    position: absolute;
    left: 0;
    top: 48px;
    width: 800px;
    height: 1px;
    background: #000;
    z-index: 10;
  }

  /* ─── TIDE CANVAS: full width, top 0, height 276 ─── */
  #tide-canvas {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    z-index: 1;
  }

  /* ─── BOTTOM ROW: top 276, height 204 ─── */
  #bottom-row {
    position: absolute;
    left: 0;
    top: 276px;
    width: 800px;
    height: 204px;
    display: flex;
    z-index: 10;
  }

  /* ─── PANELS: each 200 × 204px ─── */
  .panel {
    position: relative;
    width: 200px;
    height: 204px;
    flex-shrink: 0;
    background: #fff;
    border-top: 1px solid #000;
    border-right: 1px solid #000;
    overflow: hidden;
  }
  .panel:last-child { border-right: none; }

  /* ─── NEXT TIDE PANEL ─── */
  .next-height {
    position: absolute;
    left: calc(50% + 0.5px);
    top: 31px;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    align-items: center;
    white-space: nowrap;
  }

  .next-height-group {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .next-height-ft { display: flex; align-items: center; gap: 11px; }
  .next-height-in { display: flex; align-items: center; gap: 8px; }

  .next-num {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.64px;
    color: #000;
  }

  .next-unit {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 4.4px;
    text-transform: uppercase;
    color: #000;
  }

  .next-direction {
    position: absolute;
    left: calc(50% + 0.5px);
    transform: translate(-50%, -50%);
    width: 36px;
    height: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .next-time-display {
    position: absolute;
    left: calc(50% + 0.5px);
    top: calc(50% + 34.5px);
    transform: translate(-50%, -50%);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.64px;
    color: #000;
    white-space: nowrap;
    text-align: center;
  }

  .next-label {
    position: absolute;
    left: calc(50% + 1px);
    top: 165.5px;
    transform: translate(-50%, -50%);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 4.4px;
    text-transform: uppercase;
    color: #000;
    white-space: nowrap;
    text-align: center;
  }

  /* ─── SUNRISE / SUNSET PANEL ─── */
  #panel-sun {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 0;
  }

  .sun-content {
    display: flex;
    flex-direction: column;
    gap: 40px;
    align-items: center;
    width: 246px;
  }

  .sun-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    width: 100%;
  }

  .sun-row-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sun-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sun-time {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.64px;
    color: #000;
    white-space: nowrap;
  }

  .sun-label {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 4.4px;
    text-transform: uppercase;
    color: #000;
    text-align: center;
    width: 100%;
  }

  /* ─── MOON PHASE PANEL ─── */
  .moon-image {
    position: absolute;
    left: 50%;
    top: calc(50% - 38.5px);
    transform: translate(-50%, -50%);
    width: 88px;
    height: 88px;
  }

  .moon-age {
    position: absolute;
    left: 50%;
    top: 137px;
    transform: translate(-50%, -50%);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.64px;
    color: #000;
    white-space: nowrap;
    text-align: center;
  }

  .moon-label {
    position: absolute;
    left: 50%;
    top: 166.5px;
    transform: translate(-50%, -50%);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 4.4px;
    color: #000;
    text-transform: uppercase;
    white-space: nowrap;
    text-align: center;
  }

  /* ─── TIDE CYCLE PANEL ─── */
  .tide-cycle-curve {
    position: absolute;
    left: calc(50% + 0.5px);
    top: calc(50% - 39.5px);
    transform: translate(-50%, -50%);
    width: 92px;
    height: 92px;
  }

  .tide-cycle-code {
    position: absolute;
    left: calc(50% - 0.5px);
    top: 137px;
    transform: translate(-50%, -50%);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.64px;
    color: #000;
    white-space: nowrap;
    text-align: center;
  }

  .tide-cycle-label {
    position: absolute;
    left: calc(50% - 1px);
    top: 166.5px;
    transform: translate(-50%, -50%);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 4.4px;
    color: #000;
    text-transform: uppercase;
    white-space: nowrap;
    text-align: center;
  }
</style>
</head>
<body>
<div id="clock" class="no-data">

  <!-- Canvas sits behind all HTML elements -->
  <canvas id="tide-canvas"></canvas>

  <!-- Header -->
  <div id="header">
    <div id="header-left">
      <span id="header-time">10:30 AM</span>

  <!-- Separator line below header -->

  <!-- Bottom row panels -->
  <div id="bottom-row">
    <div class="panel" id="panel-next-tide"></div>
    <div class="panel" id="panel-tide-cycle"></div>
    <div class="panel" id="panel-sun"></div>
    <div class="panel" id="panel-moon"></div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────
//  DEMO MODE
//  Set to false to use live API data
// ─────────────────────────────────────────────────────
const DEMO_MODE = false;

function loadDemoData() {
  const today = new Date();

  function tideISO(dayOffset, hours, minutes) {
    const d = new Date(today);
    d.setDate(d.getDate() + dayOffset);
    d.setHours(hours, minutes, 0, 0);
    return d.toISOString().slice(0, 16);
  }

  DATA.tides = [
    // Yesterday
    { iso: tideISO(-1,  1, 47), height: 1.0, type: 'L' },
    { iso: tideISO(-1,  8, 12), height: 4.0, type: 'H' },
    { iso: tideISO(-1, 14, 38), height: 1.1, type: 'L' },
    { iso: tideISO(-1, 21,  3), height: 4.0, type: 'H' },
    // Today
    { iso: tideISO( 0,  2, 33), height: 1.0, type: 'L' },
    { iso: tideISO( 0,  9, 48), height: 4.0, type: 'H' },
    { iso: tideISO( 0, 15, 52), height: 1.0, type: 'L' },
    { iso: tideISO( 0, 22, 14), height: 4.0, type: 'H' },
    // Tomorrow
    { iso: tideISO( 1,  3, 18), height: 1.0, type: 'L' },
    { iso: tideISO( 1, 10, 25), height: 4.0, type: 'H' },
    { iso: tideISO( 1, 16, 40), height: 1.0, type: 'L' },
    { iso: tideISO( 1, 22, 55), height: 4.0, type: 'H' },
  ];

  DATA.graphDate  = today.toISOString().slice(0, 10);
  DATA.sunrise    = '6:08 AM';
  DATA.sunset     = '8:04 PM';
  DATA.waterTempF = 54.2;
  DATA.windDir    = 'NW';
  DATA.windMph    = 12;
  DATA.rain       = { hoursSince: 36, lastAmountIn: 0.3, display: '36 HRS' };

  // Override current time for demo purposes — set to null to use real time
  const demoHour = new Date(today); demoHour.setHours(7, 0, 0, 0);
  DATA.demoTime  = demoHour;
}

// ─────────────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────────────
function parseSunTime(timeStr, dateStr) {
  const [time, ampm] = timeStr.trim().split(' ');
  let [h, m] = time.split(':').map(Number);
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  return new Date(`${dateStr}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`);
}

function cosineInterp(h1, h2, t) {
  const t2 = (1 - Math.cos(t * Math.PI)) / 2;
  return h1 * (1 - t2) + h2 * t2;
}

function getHeightAt(ms, pts) {
  for (let k = 0; k < pts.length - 1; k++) {
    if (pts[k].ms <= ms && ms <= pts[k + 1].ms) {
      const frac = (ms - pts[k].ms) / (pts[k + 1].ms - pts[k].ms);
      return cosineInterp(pts[k].h, pts[k + 1].h, frac);
    }
  }
  if (ms < pts[0].ms) {
    const frac = (ms - pts[0].ms) / (pts[1].ms - pts[0].ms);
    return cosineInterp(pts[0].h, pts[1].h, Math.max(0, frac));
  }
  const n = pts.length;
  const frac = (ms - pts[n - 2].ms) / (pts[n - 1].ms - pts[n - 2].ms);
  return cosineInterp(pts[n - 2].h, pts[n - 1].h, Math.min(1, frac));
}

function formatHeight(h) {
  const neg = h < 0;
  const abs = Math.abs(h);
  let ft   = Math.floor(abs);
  let inch = Math.round((abs - ft) * 12);
  if (inch === 12) { ft += 1; inch = 0; }
  return `${neg ? '-' : ''}${ft}'${inch}"`;
}

function formatHoursSinceRain(hours) {
  return `${hours} HR${hours !== 1 ? 'S' : ''}`;
}

function formatTime12Short(date) {
  let h = date.getHours() % 12 || 12;
  const m = date.getMinutes();
  return `${h}:${String(m).padStart(2, '0')}`;
}

function formatTime12Full(date) {
  let h = date.getHours();
  const m = date.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, '0')} ${ampm}`;
}

function formatHeaderDate(date) {
  const DAYS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return `${DAYS[date.getDay()]} ${MONTHS[date.getMonth()]} ${date.getDate()} ${date.getFullYear()}`;
}

// ─────────────────────────────────────────────────────
//  TIDE GRAPH  (unchanged from previous version — Step 3 will update)
// ─────────────────────────────────────────────────────
function drawTideGraph() {
  const canvas = document.getElementById('tide-canvas');
  const ctx    = canvas.getContext('2d');
  const W = 800, H = 276;

  const dpr = window.devicePixelRatio || 1;
  canvas.width        = W * dpr;
  canvas.height       = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  const CURVE_TOP    = 118;
  const CURVE_BOTTOM = 221;
  const HOUR_Y       = 254;
  const DOT_RADIUS   = 5;

  // No data — nothing to draw
  if (DATA.tides.length === 0 || !DATA.sunrise || !DATA.sunset) return;

  const sunriseDate = parseSunTime(DATA.sunrise, DATA.graphDate);
  const sunsetDate  = parseSunTime(DATA.sunset,  DATA.graphDate);
  const tStart = sunriseDate.getTime();
  const tEnd   = sunsetDate.getTime();

  function toX(ms) { return ((ms - tStart) / (tEnd - tStart)) * W; }

  const allHeights = DATA.tides.map(t => t.height);
  const minH = Math.min(...allHeights) - 0.5;
  const maxH = Math.max(...allHeights) + 0.5;
  function toY(h) {
    const norm = (h - minH) / (maxH - minH);
    return CURVE_TOP + (CURVE_BOTTOM - CURVE_TOP) * (1 - norm);
  }

  const pts = DATA.tides.map(t => ({ ms: new Date(t.iso).getTime(), h: t.height }));

  // 1 — Tide curve
  ctx.save();
  ctx.beginPath();
  const SAMPLES = 900;
  let first = true;
  for (let i = 0; i <= SAMPLES; i++) {
    const ms = tStart + (i / SAMPLES) * (tEnd - tStart);
    const x  = toX(ms);
    const y  = toY(getHeightAt(ms, pts));
    first ? (ctx.moveTo(x, y), first = false) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#000';
  ctx.lineWidth   = 2.5;
  ctx.lineJoin    = 'round';
  ctx.lineCap     = 'round';
  ctx.stroke();
  ctx.restore();

  // 2 — Orange time bar (y:48 → y:276, sits above curve)
  const now   = DATA.demoTime || new Date();
  const nowMs = now.getTime();
  if (nowMs >= tStart && nowMs <= tEnd) {
    ctx.save();
    ctx.fillStyle = '#ff8000';
    ctx.fillRect(toX(nowMs) - 2, 48, 4, 228);
    ctx.restore();
  }

  // 3 — Peak dots
  const peaksInWindow = DATA.tides.filter(t => {
    const ms = new Date(t.iso).getTime();
    return ms > tStart && ms < tEnd;
  });

  peaksInWindow.forEach(tide => {
    const x = toX(new Date(tide.iso).getTime());
    const y = toY(tide.height);
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, DOT_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.restore();
  });

  // 4 — Hour labels
  ctx.save();
  ctx.fillStyle     = '#000';
  ctx.font          = '600 12px Inter, sans-serif';
  ctx.letterSpacing = '4.8px';
  ctx.textAlign     = 'left';
  ctx.textBaseline  = 'middle';

  const srHour = sunriseDate.getHours() + sunriseDate.getMinutes() / 60;
  const ssHour = sunsetDate.getHours()  + sunsetDate.getMinutes()  / 60;
  let hourCursor = Math.ceil(srHour);
  if (hourCursor % 2 === 0) hourCursor += 1;

  for (let h = hourCursor; h < ssHour; h += 2) {
    const d = new Date(sunriseDate);
    d.setHours(h, 0, 0, 0);
    const x = toX(d.getTime());
    const label = h < 12 ? `${h}A` : (h === 12 ? '12P' : `${h - 12}P`);
    ctx.fillText(label, x, HOUR_Y);
  }
  ctx.restore();

  // 5 — Peak labels (type / height / time) — highest layer
  peaksInWindow.forEach(tide => {
    const x = toX(new Date(tide.iso).getTime());
    const y = toY(tide.height);
    ctx.save();
    ctx.fillStyle     = '#000';
    ctx.font          = '600 12px Inter, sans-serif';
    ctx.letterSpacing = '4.8px';
    ctx.textAlign     = 'left';
    ctx.textBaseline  = 'middle';
    ctx.fillText(tide.type,                             x, y - 43);
    ctx.fillText(formatHeight(tide.height),              x, y - 29);
    ctx.fillText(formatTime12Short(new Date(tide.iso)),  x, y - 15);
    ctx.restore();
  });
}

async function fetchTidePredictions() {
  const STATION = '9413745';
  const fmtDate = d =>
    `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const today     = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const tomorrow  = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const url = 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter'
    + `?begin_date=${fmtDate(yesterday)}&end_date=${fmtDate(tomorrow)}`
    + `&station=${STATION}&product=predictions&datum=MLLW`
    + `&time_zone=lst_ldt&interval=hilo&units=english&format=json`;
  try {
    const res  = await fetch(url);
    const json = await res.json();
    if (!json.predictions) throw new Error(json.error?.message || 'No predictions in response');
    DATA.tides = json.predictions.map(p => ({
      iso:    p.t.replace(' ', 'T'),
      height: parseFloat(p.v),
      type:   p.type,
    }));
    DATA.graphDate = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    console.info(`✓ Tide predictions loaded: ${DATA.tides.length} points for ${DATA.graphDate}`);
  } catch (err) {
    console.warn('Tide fetch failed — tides unavailable.', err.message);
  }
}

function degreesToCardinal(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

async function fetchWeather() {
  const LAT = 36.9741, LNG = -122.0308;
  try {
    const [windRes, tempRes] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LNG}&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=mph`),
      fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${LAT}&longitude=${LNG}&current=sea_surface_temperature`),
    ]);
    const [windJson, tempJson] = await Promise.all([windRes.json(), tempRes.json()]);
    if (windJson.current) {
      DATA.windMph = Math.round(windJson.current.wind_speed_10m);
      DATA.windDir = degreesToCardinal(windJson.current.wind_direction_10m);
    }
    if (tempJson.current) {
      DATA.waterTempF = parseFloat((tempJson.current.sea_surface_temperature * 9 / 5 + 32).toFixed(1));
    }
    console.info(`✓ Weather loaded: ${DATA.windDir} ${DATA.windMph}mph, water ${DATA.waterTempF}°F`);
  } catch (err) {
    console.warn('Weather fetch failed — header stats unavailable.', err.message);
  }
}

async function fetchRainData() {
  const LAT = 36.9741, LNG = -122.0308;
  const THRESHOLD_IN = 0.1;
  const MAX_HOURS    = 120;
  const url = `https://api.open-meteo.com/v1/forecast`
    + `?latitude=${LAT}&longitude=${LNG}`
    + `&hourly=precipitation`
    + `&past_days=5`
    + `&timezone=America%2FLos_Angeles`
    + `&precipitation_unit=inch`;
  try {
    const res  = await fetch(url);
    const json = await res.json();
    if (!json.hourly?.time || !json.hourly?.precipitation) {
      throw new Error('Unexpected response shape from Open-Meteo rain endpoint');
    }
    const times  = json.hourly.time;
    const precip = json.hourly.precipitation;
    const localStr      = new Date().toLocaleString('sv-SE', { timeZone: 'America/Los_Angeles' });
    const currentHourStr = localStr.slice(0, 13).replace(' ', 'T') + ':00';
    let currentIdx = times.indexOf(currentHourStr);
    if (currentIdx === -1) {
      currentIdx = 0;
      for (let i = times.length - 1; i >= 0; i--) {
        if (times[i] <= currentHourStr) { currentIdx = i; break; }
      }
    }
    let lastRainIdx = -1;
    for (let i = currentIdx; i >= 0; i--) {
      if (precip[i] != null && precip[i] >= THRESHOLD_IN) { lastRainIdx = i; break; }
    }
    if (lastRainIdx === -1) { DATA.rain = null; return; }
    const hoursSince = currentIdx - lastRainIdx;
    if (hoursSince > MAX_HOURS) { DATA.rain = null; return; }
    const lastAmountIn = Math.round(precip[lastRainIdx] * 10) / 10;
    DATA.rain = { hoursSince, lastAmountIn, display: formatHoursSinceRain(hoursSince) };
    console.info(`✓ Rain data: last rain ${hoursSince}h ago (${lastAmountIn}in) — display: "${DATA.rain.display}"`);
  } catch (err) {
    console.warn('Rain data fetch failed — widget will be hidden.', err.message);
    DATA.rain = null;
  }
}

async function fetchSunriseSunset() {
  const LAT = 36.9741, LNG = -122.0308;
  const url = `https://api.sunrise-sunset.org/json?lat=${LAT}&lng=${LNG}&formatted=0`;
  try {
    const res  = await fetch(url);
    const json = await res.json();
    if (json.status !== 'OK') throw new Error(json.status);
    const toLocalTime = isoStr => {
      const d = new Date(isoStr);
      let h = d.getHours();
      const m = d.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${String(m).padStart(2, '0')} ${ampm}`;
    };
    DATA.sunrise = toLocalTime(json.results.sunrise);
    DATA.sunset  = toLocalTime(json.results.sunset);
    console.info(`✓ Sunrise/Sunset loaded: ${DATA.sunrise} / ${DATA.sunset}`);
  } catch (err) {
    console.warn('Sunrise/Sunset fetch failed — keeping dummy data.', err.message);
  }
}

function animatePanel(id, updateFn, duration = 300) {
  const panel = document.getElementById(id);

//  MOON + TIDE CYCLE  (unchanged)
// ─────────────────────────────────────────────────────
function computeMoonData(date) {
  const LUNAR_CYCLE = 29.53058867;
  const REF_MS = Date.UTC(2000, 0, 6, 6, 44, 0);
  const daysSince = (date.getTime() - REF_MS) / 86400000;
  const age = ((daysSince % LUNAR_CYCLE) + LUNAR_CYCLE) % LUNAR_CYCLE;
  let phase;
  if      (age <  1.85) phase = 'NEW MOON';
  else if (age <  7.38) phase = 'WAXING CRESCENT';
  else if (age <  9.22) phase = 'FIRST QUARTER';
  else if (age < 14.77) phase = 'WAXING GIBBOUS';
  else if (age < 16.61) phase = 'FULL MOON';
  else if (age < 22.15) phase = 'WANING GIBBOUS';
  else if (age < 23.99) phase = 'LAST QUARTER';
  else                   phase = 'WANING CRESCENT';
  return { age: parseFloat(age.toFixed(1)), phase };
}

function computeTideCycle(moonAge) {
  const pos = moonAge % 14.765;
  if (pos < 4.5)  return 'Spring Tide';
  if (pos < 6.5)  return 'Half Tide';
  if (pos < 10.5) return 'Neap Tide';
  if (pos < 12.5) return 'Half Tide';
  return 'Spring Tide';
}

// ─────────────────────────────────────────────────────
//  NEXT TIDE CHANGE DETECTION  (unchanged)
// ─────────────────────────────────────────────────────
let _currentNextTideIso = null;

function _peekNextTideIso() {
  if (!DATA.tides.length) return null;
  const nowMs  = Date.now();
  const sorted = DATA.tides
    .map(t => ({ iso: t.iso, ms: new Date(t.iso).getTime() }))
    .filter(t => t.ms > nowMs)
    .sort((a, b) => a.ms - b.ms);
  return sorted[0] ? sorted[0].iso : null;
}

// ─────────────────────────────────────────────────────
//  SCHEDULED REFRESHES  (unchanged)
// ─────────────────────────────────────────────────────
async function _runHourlyWeather() {
  await Promise.allSettled([fetchWeather(), fetchRainData()]);
  animateElement('header-wind', () => {
    document.getElementById('header-wind').textContent =
      (DATA.windDir != null && DATA.windMph != null) ? `${DATA.windDir} ${DATA.windMph}MPH` : '--';
  });
  animateElement('header-temp', () => {
    document.getElementById('header-temp').textContent =
      DATA.waterTempF != null ? `${DATA.waterTempF}°F` : '--';
  });
  populateRain();
  const now          = new Date();
  const msToNextHour = (60 - now.getMinutes()) * 60000
                     - now.getSeconds()         * 1000
                     - now.getMilliseconds();
  setTimeout(_runHourlyWeather, msToNextHour);
}

function scheduleHourlyWeather() {
  const now          = new Date();
  const msToNextHour = (60 - now.getMinutes()) * 60000
                     - now.getSeconds()         * 1000
                     - now.getMilliseconds();
  setTimeout(_runHourlyWeather, msToNextHour);
}

async function dailyRefresh() {
  DATA.tides    = [];
  DATA.sunrise  = null;
  DATA.sunset   = null;
  _currentNextTideIso = null;
  await Promise.allSettled([fetchTidePredictions(), fetchSunriseSunset(), fetchRainData()]);
  const now      = new Date();
  const moonData = computeMoonData(now);
  DATA.moonPhase = moonData.phase;
  DATA.moonAge   = moonData.age;
  DATA.tideCycle = computeTideCycle(moonData.age);
  animatePanel('panel-next-tide',  populateNextTide);
  animatePanel('panel-tide-cycle', populateTideCycle);
  animatePanel('panel-sun',        populateSunriseSunset);
  animatePanel('panel-moon',       populateMoonPhase);
  animateTideGraph();
  populateRain();
  console.info('✓ Daily refresh complete');
}

function scheduleDailyRefresh() {
  const now  = new Date();
  const next = new Date(now);
  next.setHours(0, 1, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  const delay = next - now;
  setTimeout(async () => {
    await dailyRefresh();
    setInterval(dailyRefresh, 24 * 60 * 60 * 1000);
  }, delay);
}

// ─────────────────────────────────────────────────────
//  INIT  (unchanged)
// ─────────────────────────────────────────────────────
(function init() {
  updateHeader();
  populateNextTide();
  populateTideCycle();
  populateSunriseSunset();
  populateMoonPhase();
  drawTideGraph();
  setInterval(() => {
    updateHeader();
    drawTideGraph();
    const freshIso = _peekNextTideIso();
    if (freshIso !== _currentNextTideIso) {
      if (_currentNextTideIso !== null) {
        animatePanel('panel-next-tide', populateNextTide);
      }
      _currentNextTideIso = freshIso;
    }
  }, 1000);

  function _populateAll() {
    const now      = new Date();
    const moonData = computeMoonData(now);
    DATA.moonPhase = moonData.phase;
    DATA.moonAge   = moonData.age;
    DATA.tideCycle = computeTideCycle(moonData.age);
    updateHeader();
    populateNextTide();
    populateTideCycle();
    populateSunriseSunset();
    populateMoonPhase();
    drawTideGraph();
    populateRain();
    _currentNextTideIso = _peekNextTideIso();
    document.getElementById('clock').classList.remove('no-data');
  }

  if (DEMO_MODE) {
    // ── DEMO: skip all API fetches, use static sample data ──
    loadDemoData();
    _populateAll();
    console.info('⚙️ DEMO MODE active — set DEMO_MODE = false to use live data');
  } else {
    // ── LIVE: fetch from NOAA, Open-Meteo, sunrise-sunset.org ──
    Promise.allSettled([fetchTidePredictions(), fetchSunriseSunset(), fetchWeather(), fetchRainData()])
      .then(() => {
        try {
          _populateAll();
        } catch (err) {
          console.error('Error populating panels after fetch:', err);
          document.getElementById('clock').classList.remove('no-data');
        }
      });

    scheduleHourlyWeather();
    scheduleDailyRefresh();
  }
})();

</script>
